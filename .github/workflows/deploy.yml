name: Backend Deploy

on:
  push:
    branches:
      - main
      - uat

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Backend to Server
        run: |
          echo "Starting deployment process..."
          
          # If pushing to main (Production - port 8005)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying to Production..."
            # Optional: pull latest code or copy files if needed
            sudo systemctl restart logistics-prod-backend
            echo "Production service restarted successfully."
          
          # If pushing to uat (UAT - port 8006)
          elif [[ "${{ github.ref }}" == "refs/heads/uat" ]]; then
            echo "Deploying to UAT..."
            sudo systemctl restart logistics-uat-backend
            echo "UAT service restarted successfully."
          fi
          
          echo "Deployment complete!"