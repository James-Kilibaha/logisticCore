name: Backend Deploy

on:
  push:
    branches:
      - main
      - uat

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy to Server
        run: |
          echo "Starting deployment process..."
          
          # If pushing to main (Production)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying to Production..."
          
            cd /Data/www/logistics/prod/backend
            rsync -av --delete --exclude='.git' $GITHUB_WORKSPACE/ ./
          
            # Auto-create venv if it doesn't exist
            if [ ! -d "venv" ]; then
              echo "Production venv missing. Creating virtual environment..."
              python3 -m venv venv
            fi
          
            ./venv/bin/pip install --prefer-binary -r requirements.txt
            sudo systemctl restart logistics-api-prod.service
            echo "Production deployment complete & service restarted!"
          
          # If pushing to uat (UAT)
          elif [[ "${{ github.ref }}" == "refs/heads/uat" ]]; then
            echo "Deploying to UAT..."
          
            cd /Data/www/logistics/uat/backend
            rsync -av --delete --exclude='.git' $GITHUB_WORKSPACE/ ./
          
            # Auto-create venv if it doesn't exist
            if [ ! -d "venv" ]; then
              echo "UAT venv missing. Creating virtual environment..."
              python3 -m venv venv
            fi
          
            ./venv/bin/pip install --prefer-binary -r requirements.txt
            sudo systemctl restart logistics-api-uat.service
            echo "UAT deployment complete & service restarted!"
          fi