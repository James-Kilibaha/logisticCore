name: Deploy Logistics Flutter Web

on:
  push:
    branches:
      - main
      - uat
    pull_request:
      branches:
        - main
        - uat

jobs:
  build-and-deploy:
    runs-on: [self-hosted, logistics-runner]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "API_URL=https://api.logistics.kodimaster.co.tz" >> $GITHUB_ENV
            echo "DEPLOY_PATH=/Data/www/logistics/prod/frontend" >> $GITHUB_ENV
          else
            echo "ENV_NAME=uat" >> $GITHUB_ENV
            echo "API_URL=https://api.logistics-uat.kodimaster.co.tz" >> $GITHUB_ENV
            echo "DEPLOY_PATH=/Data/www/logistics/uat/frontend" >> $GITHUB_ENV
          fi

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter build web --release --dart-define=API_BASE_URL=${{ env.API_URL }}

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/web/*"
          target: "${{ env.DEPLOY_PATH }}"
          strip_components: 2