name: Backend Test & Deploy

on:
  push:
    branches:
      - main
      - uat
  pull_request:
    branches:
      - uat
      - main

jobs:
  test-and-deploy:
    runs-on: [self-hosted, logistics-runner]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest -q
        # Verification: If any test fails, pytest exits with code != 0, 
        # causing GitHub Actions to abort immediately and block deployment.

      - name: Deploy to Production / UAT
        if: github.event_name == 'push'
        run: |
          echo "All tests passed successfully. Proceeding with deployment..."
          # Add your service restart or file sync commands here