name: Backend Deploy

on:
  push:
    branches:
      - main
      - uat

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Deploy to Server
        run: |
          echo "Starting deployment process..."
          
          # If pushing to main (Production)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying to Production..."
          
            # Sync repository files to production directory
            sudo rsync -av --delete --exclude='.git' ./ /Data/www/logistics/prod/backend/
          
            # Install/update dependencies inside the production venv
            sudo /Data/www/logistics/prod/backend/venv/bin/pip install --prefer-binary -r /Data/www/logistics/prod/backend/requirements.txt
          
            # Restart the production FastAPI service
            sudo systemctl restart logistics-api-prod.service
            echo "Production deployment complete & service restarted!"
          
          # If pushing to uat (UAT)
          elif [[ "${{ github.ref }}" == "refs/heads/uat" ]]; then
            echo "Deploying to UAT..."
          
            # Sync repository files to UAT directory
            sudo rsync -av --delete --exclude='.git' ./ /Data/www/logistics/uat/backend/
          
            # Install/update dependencies inside the UAT venv
            sudo /Data/www/logistics/uat/backend/venv/bin/pip install --prefer-binary -r /Data/www/logistics/uat/backend/requirements.txt
          
            # Restart the UAT FastAPI service
            sudo systemctl restart logistics-api-uat.service
            echo "UAT deployment complete & service restarted!"
          fi