name: TransportCore

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ci-password
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      TEST_DATABASE_NAME: logistic_db_test
      SECRET_KEY: ci-secret-key-not-for-production
      SCHEDULER_ENABLED: "false"
      SMS_AUTO_SEND: "false"
      FILES_DIR: /tmp/logistic-test-files

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libreoffice-writer

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Prepare Test Storage
        run: mkdir -p "$FILES_DIR"

      - name: Run Tests
        env:
          PYTHONPATH: .
        run: pytest -q