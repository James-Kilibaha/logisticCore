# =====================================================================================
#  Logistic (SaaS) - nginx: web app + API kwa KAMPUNI ZOTE kwenye server moja
#
#    https://<code>.logistic.co.tz/        -> Flutter web ya kampuni hiyo (mf. ymg.logistic.co.tz)
#    https://ymg.co.tz/                    -> kampuni yenye domain yake (iwekwe kwenye admin panel)
#    https://logistic.co.tz/               -> domain kuu (kuingia kwa code ya kampuni / kufungua akaunti)
#    .../api/...                           -> logisticCore (uvicorn 127.0.0.1:8000)
#    App ya simu                           -> https://api.logistic.co.tz/api/... (au domain kuu)
#
#  API inatambua kampuni kwa Host header (nginx inaipitisha: proxy_set_header Host $host).
#
#  1. Badilisha  logistic.co.tz  kuwa PLATFORM_DOMAIN yako (server_name hapo chini) na kwenye .env.
#  2. DNS: A record ya  logistic.co.tz  NA  *.logistic.co.tz  -> IP ya server.
#     Kampuni yenye domain yake: A record ya domain yake (mf. ymg.co.tz) -> IP ya server hii hii.
#  3. sudo cp deploy/nginx.conf /etc/nginx/sites-available/logistic
#     sudo ln -sf /etc/nginx/sites-available/logistic /etc/nginx/sites-enabled/logistic
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#  4. HTTPS:
#     - Domain kuu + subdomain zote (cheti cha wildcard kinahitaji DNS challenge):
#         sudo certbot certonly --manual --preferred-challenges dns -d logistic.co.tz -d '*.logistic.co.tz'
#       (au plugin ya DNS ya mtoa huduma wako wa DNS). Kisha weka njia za cheti kwenye server ya 443 hapo chini.
#     - Kila domain ya kampuni:  sudo certbot --nginx -d ymg.co.tz -d www.ymg.co.tz
#       (certbot anaongeza server block yake; bado inatumia root na /api ile ile - tazama "custom domain" chini)
# =====================================================================================

upstream logisticcore {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Kubana maombi ya kuingia / code ya SMS / kusahau nywila (juu ya ulinzi wa ndani wa API)
limit_req_zone $binary_remote_addr zone=logistic_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # HTTPS (baada ya kupata cheti):
    # listen 443 ssl default_server;
    # listen [::]:443 ssl default_server;
    # ssl_certificate     /etc/letsencrypt/live/logistic.co.tz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/logistic.co.tz/privkey.pem;
    # domain kuu, subdomain zote za kampuni, na domain za kampuni (default_server = domain yoyote
    # iliyoelekezwa kwenye server hii - API itaangalia kama ni ya kampuni gani)
    server_name logistic.co.tz *.logistic.co.tz _;

    access_log /var/log/nginx/logistic.access.log;
    error_log  /var/log/nginx/logistic.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               application/wasm image/svg+xml application/manifest+json;

    # ---------------------------------------------------------------- API (FastAPI)
    # ^~ : kila kitu chini ya /api/ kinaenda kwa API (hata picha .jpg za open-images)
    location ^~ /api/ {
        client_max_body_size 25m;        # picha za mizigo, Excel ya kuingiza data, picha za madai
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;         # backup kubwa, ripoti za PDF/Excel
        proxy_send_timeout 300s;
        proxy_buffering off;             # PDF / Excel zinaanza kupakuliwa mara moja
        proxy_pass http://logisticcore;

        # Kuingia, code ya SMS na kusahau nywila: maombi 10 kwa dakika kwa kila IP
        location ~ ^/api/(login|auth/forgot) {
            limit_req zone=logistic_auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://logisticcore;
        }
    }

    # /docs (imefungwa production kwenye .env: API_DOCS=false)
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://logisticcore;
    }

    # ---------------------------------------------------------------- Web app (Flutter)
    root /var/www/logistic/web;          # build/web inawekwa hapa (logistic_app/deploy/upload_web.*) - moja kwa kampuni zote
    index index.html;

    # Faili zinazobadilika kila toleo: kivinjari kiulize kila mara ili toleo jipya lionekane mara moja
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|flutter\.js|main\.dart\.js|version\.json|manifest\.json|favicon\.png|favicon\.ico|icons/.+)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Fonts, picha, canvaskit/wasm: zinahifadhiwa
    location ^~ /canvaskit/ { expires 30d; add_header Cache-Control "public" always; try_files $uri =404; }
    location ^~ /assets/    { expires 7d;  add_header Cache-Control "public" always; try_files $uri =404; }
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf|wasm)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # Kila kitu kingine -> app (Flutter ina njia zake, mf. /#/track?code=...)
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~ /\. { deny all; }         # .git, .env n.k.
}

